# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  release:
    types: [published]

jobs:
  build-n-publish:
    name: Build and publish Python distro to PyPI
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    environment:
      name: pypi
      url: https://pypi.org

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    # Installs uv and sets up the specified Python version instantly
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v10
      with:
        version: "latest"
        python-version: "3.12" # Matches your pyproject.toml requirement (>=3.12)

    # Uses uv to build both the source tarball and wheel distributions
    - name: Build source and wheel distributions
      run: uv build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

